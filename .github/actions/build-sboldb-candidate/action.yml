name: Build SBOL DB candidate
description: Build an unmerged SBOL DB commit for testing without publishing an image.
inputs:
  revision:
    description: Exact SBOL DB commit to test.
    required: true
  image:
    description: Local image tag included in the test artifact.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
      with:
        repository: marpaia/sbol-db
        ref: ${{ inputs.revision }}
        path: sbol-db-candidate
        persist-credentials: false
    - name: Verify candidate revision
      shell: bash
      env:
        SBOLDB_REVISION: ${{ inputs.revision }}
      run: test "$(git -C sbol-db-candidate rev-parse HEAD)" = "$SBOLDB_REVISION"
    - uses: docker/setup-buildx-action@v3
    - name: Build candidate image
      uses: docker/build-push-action@v6
      with:
        context: sbol-db-candidate
        file: sbol-db-candidate/Dockerfile
        load: true
        push: false
        tags: ${{ inputs.image }}
        labels: |
          org.opencontainers.image.source=https://github.com/marpaia/sbol-db
          org.opencontainers.image.revision=${{ inputs.revision }}
        cache-from: type=gha,scope=sbol-db-pr36
        cache-to: type=gha,mode=max,scope=sbol-db-pr36
        provenance: false
    - name: Record candidate image identity
      shell: bash
      env:
        SBOLDB_IMAGE: ${{ inputs.image }}
      run: docker image inspect "$SBOLDB_IMAGE" > sbol-db-image.json
