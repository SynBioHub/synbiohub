name: Integration testing

on: push

env:
  SYNBIOHUB_DOCKER_REF: bfa8929bad064c2e40557670f877c32a1a5be24f
  SBOLDB_IMAGE: ghcr.io/marpaia/sbol-db:v0.1.8@sha256:ec35a160248e1db1b50e2a55c251e140c6f2f6c0d5781822b5140aa475af759b
  # The immutable baseline contains the private/public search policy under test.
  SBOLEXPLORER_IMAGE: myersresearchgroup/sbolexplorer@sha256:ef904541fe6ad700777b3607660a01cfbf2972d214a818a53bec5a178f6bc4c3

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        name: Checkout source tree
      - uses: nick-invision/retry@v1
        name: Build docker image
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: docker build . --file docker/Dockerfile --tag synbiohub/synbiohub:snapshot-standalone
      - name: Package image
        run: |
          docker save synbiohub/synbiohub:snapshot-standalone | gzip > sbh.tar.gz
      - uses: actions/upload-artifact@v4
        name: Upload Docker image
        with:
          name: sbh-image
          path: sbh.tar.gz
  search-backend-harness:
    name: Search backend harness unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        name: Checkout source tree
      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: '3.9' # To match the integration-test jobs
      - name: Run search backend harness unit tests
        run: |
          python -m unittest \
            tests/search-backends/test_run_conformance.py \
            tests/search-backends/test_compare_reports.py
  sboltests:
    name: SBOL Test Suite
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        name: Checkout source tree
      - uses: actions/download-artifact@v4
        name: Download Docker image
        with:
          name: sbh-image
      - name: Import saved Docker image
        run: |
          cat sbh.tar.gz | docker load
      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: '3.9' # To match the one in Travis
      - name: Install test dependencies
        run: |
          pip install -r tests/test_requirements.txt
      - uses: nick-invision/retry@v1
        name: Run test suite
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: tests/sbolsuite.sh
  sbhtests:
    name: SynBioHub Test Suite
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        name: Checkout source tree
      - uses: actions/download-artifact@v4
        name: Download Docker image
        with:
          name: sbh-image
      - name: Import saved Docker image
        run: |
          cat sbh.tar.gz | docker load
      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: '3.9' # To match the one in Travis
      - name: Install test dependencies
        run: |
          pip install -r tests/test_requirements.txt
      - name: Run tests
        run: |
          tests/test.sh --stopaftertestsuite
  sboltests-sboldb:
    name: SBOL Test Suite (sbol-db)
    needs: build
    runs-on: ubuntu-latest
    env:
      SBH_TRIPLESTORE: sboldb
    steps:
      - uses: actions/checkout@v5
        name: Checkout source tree
      - uses: actions/download-artifact@v4
        name: Download Docker image
        with:
          name: sbh-image
      - name: Import saved Docker image
        run: |
          cat sbh.tar.gz | docker load
      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: '3.9' # To match the one in Travis
      - name: Install test dependencies
        run: |
          pip install -r tests/test_requirements.txt
      - uses: nick-invision/retry@v1
        name: Run test suite
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: tests/sbolsuite.sh
      - name: Capture SBOL DB import diagnostics
        if: always()
        run: |
          mkdir -p artifacts/sboltests-sboldb
          docker compose -p testsuiteproject \
            -f tests/synbiohub-docker/docker-compose.sboldb.yml \
            logs --no-color > artifacts/sboltests-sboldb/compose.log 2>&1 || true
          docker ps -a --filter label=com.docker.compose.project=testsuiteproject \
            > artifacts/sboltests-sboldb/containers.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sboltests-sboldb-diagnostics
          path: artifacts/sboltests-sboldb/
          retention-days: 30
  sbhtests-sboldb:
    name: SynBioHub Test Suite (sbol-db)
    needs: build
    runs-on: ubuntu-latest
    env:
      SBH_TRIPLESTORE: sboldb
    steps:
      - uses: actions/checkout@v5
        name: Checkout source tree
      - uses: actions/download-artifact@v4
        name: Download Docker image
        with:
          name: sbh-image
      - name: Import saved Docker image
        run: |
          cat sbh.tar.gz | docker load
      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: '3.9' # To match the one in Travis
      - name: Install test dependencies
        run: |
          pip install -r tests/test_requirements.txt
      - name: Run tests
        run: |
          tests/test.sh --stopaftertestsuite
  explorer-compatibility:
    name: Explorer compatibility (${{ matrix.label }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Virtuoso + SBOLExplorer
            store: virtuoso
            search: sbol-explorer
          - label: sbol-db + SBOLExplorer
            store: sboldb
            search: sbol-explorer
          - label: sbol-db + sbol-db
            store: sboldb
            search: sbol-db
    env:
      SBH_TRIPLESTORE: ${{ matrix.store }}
      SBH_SEARCH_BACKEND: ${{ matrix.search }}
      SBH_DOCKER_DIR: ${{ github.workspace }}/synbiohub-docker
      SBH_EXPLORER_INDEX_TIMEOUT: "600"
    steps:
      - uses: actions/checkout@v5
        name: Checkout SynBioHub
      - uses: actions/checkout@v5
        name: Checkout SynBioHub Docker topologies
        with:
          repository: SynBioHub/synbiohub-docker
          ref: ${{ env.SYNBIOHUB_DOCKER_REF }}
          path: synbiohub-docker
      - uses: actions/download-artifact@v4
        name: Download Docker image
        with:
          name: sbh-image
      - name: Import saved Docker image
        run: |
          gzip --decompress --stdout sbh.tar.gz | docker load
      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: '3.9'
      - name: Install test dependencies
        run: |
          pip install -r tests/test_requirements.txt
      - name: Run indexed Explorer HTML contract
        run: |
          tests/test.sh --stopaftertestsuite
  publish:
    name: Publish snapshot image
    needs: [search-backend-harness, sboltests, sbhtests, sboltests-sboldb, sbhtests-sboldb, explorer-compatibility]
    runs-on: ubuntu-latest
    if: endsWith(github.ref, 'master')
    steps:
      - uses: actions/download-artifact@v4
        name: Download Docker iamge
        with:
          name: sbh-image
      - name: Import saved Docker image
        run: |
          cat sbh.tar.gz | docker load
      - uses: azure/docker-login@v1
        name: Log into Docker Hub
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push the image to Docker Hub
        run: |
          docker push synbiohub/synbiohub:snapshot-standalone
